name: Build MY POD Android APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache & Performance
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify Android SDK Environment
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"

      - name: Generate Android Native Project
        run: npx expo prebuild --platform android --no-install

      - name: Configure Android 17 and Native 16 KB Alignment
        run: |
          # Ensure clean newline before appending properties to avoid corrupting expo.inlineModules.watchedDirectories
          printf "\nexpo.useLegacyPackaging=true\n" >> android/gradle.properties
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64/' android/gradle.properties
          # Ensure extractNativeLibs="true" is set on the Application tag
          if ! grep -q 'android:extractNativeLibs' android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application /<application android:extractNativeLibs="true" /g' android/app/src/main/AndroidManifest.xml
          fi
          echo "=== Tail of android/gradle.properties ==="
          tail -n 10 android/gradle.properties

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating debug keystore for signing..."
            keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Debug keystore already exists."
          fi

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Standalone Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --console=plain \
            --stacktrace \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 \
            -Pexpo.useLegacyPackaging=true \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Stage APK for Distribution
        run: |
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found generated APK at: $APK_PATH"
            cp "$APK_PATH" output/MY-POD.apk
            ls -lh output/MY-POD.apk
          else
            echo "ERROR: No APK found in build outputs!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MY-POD-apk
          path: output/MY-POD.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/MY-POD.apk
          name: MY POD ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
